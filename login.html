<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Library - Login</title>
</head>
<style>
    h1
    {
        color: white;
    }
    body
    {
        background-color: black;
        color: rgba(229, 8, 236, 0.774);

        min-height: 100vh;
        margin: 0;

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Arial, sans-serif;

        overflow: hidden;
    }
    .login-container
    {
        position: relative;
        z-index: 1;

        width: 400px;
        padding: 40px;
        text-align: center;

        background-color: #0c0c0cc1;
        border: 1px solid rgba(79, 237, 79, 0.3);
        border-radius: 15px;
        box-shadow: 
            0 0 30px rgba(79, 237, 79, 0.08),
            0 0 80px rgba(79, 237, 79, 0.05);
        
    }
    form
    {
        display: flex;
        flex-direction: column;
        align-items: center;

        gap: 15px;

        margin-top: 20px;
    }
    input
    {
        width: 200px;
        padding: 14px;
        box-sizing: border-box;

        background-color: #080808;
        color: white;

        border: 1px solid rgba(79, 237, 79, 0.4);
        border-radius: 8px;

        font-size: 16px;
        outline: none;
        transition: 0.3s;
    }
    input::placeholder
    {
        color: #777777;
    }
    input:focus
    {
        border-color: #4fed4f;
        box-shadow: 0 0 8px rgba(79, 237, 79, 0.3);
    }
    button
    {
        padding: 14px;

        background-color: transparent;
        color: #4fed4f;

        border: 2px solid #4fed4f;
        border-radius: 8px;

        font-size: 18px;

        cursor: pointer;
        transition: 0.3s;
    }
    button:hover
    {
        background-color: #4fed4f;
        color: black;
        box-shadow:
            0 0 10px rgba(79, 237, 79, 0.5)
            0 0 25px rgba(79, 237, 79, 0.2)
    }
    .signup-text
    {
        margin-top: 10px;
        font-size: 14px;
        color: #888888;
    }
    .signup-text a
    {
        color: #e508ec;
        text-decoration: none;
        transition: 0.3s;
    }
    .signup-text a:hover
    {
        color: #4fed4f;
        text-shadow: 0 0 8px rgb(79, 237, 79, 0.5);
    }
    #floatingcharacters
    {
        position: fixed;

        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        pointer-events: none;

        overflow: hidden;
    }
    .character
    {
        position: absolute;

        text-shadow: 0 0 3px rgba(249, 248, 248, 0.772);

        pointer-events: none;

        animation: drift linear forwards;
    }

    @keyframes drift
    {
        0%
        {
            transform:
            translate(var(--startX), var(--startY))
            rotate(0deg);

            opacity: 0;
        }
        10%
        {
          opacity: 1;
        }
        90%
        {
            opacity: 1;
        }
        100%
        {
            transform:
                translate(var(--endX), var(--endY))
                rotate(var(--rotation));
            opacity: 0;
        }
    }
</style>
<body>
    <div id="floatingcharacters"></div>
    <div class="login-container">
        <h1>
            Welcome Back!
        </h1>
        <p>
            The library has been expecting you
        </p>
        <form id="loginform">
            <input
                type="text" name="username"
                placeholder="Username"
                required
            >
            <input
                type="password" name="password"
                placeholder="Password"
                required
            >
            <button type="log-in">
                Enter
            </button>
            <p class="signup-text">
                Oh, you're new? Get in here:
                <a href="signup.html">Sign Up</a>
            </p>
        </form>
    </div>
    <script>
        const floatingcharacters = document.getElementById("floatingcharacters");
        const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz1234567890!@#$%^&*?|{}:;',.~`<>[]";
        const colors = ["rgba(229, 8, 236, 0.774)", "rgba(79, 237, 79, 0.6)", "rgba(79, 218, 237, 0.6)", 
                        "rgba(226, 237, 79, 0.9)", "rgba(56, 15, 243, 0.9)", "rgba(205, 202, 216, 0.9)",
                        "rgba(152, 152, 152, 0.9)", "rgba(42, 42, 42, 0.9)", "rgb(0, 0, 0)"]
        const fonts = ["'Courier New', Courier, monospace", "'Times New Roman', Times, serif", "'Courier New', Courier, monospace", 
                    "'Gill Sans', 'Gill Sans MT', Calibri", "'Trebuchet MS', sans-serif", "'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande'", 
                    "'Lucida Sans Unicode', Geneva, Verdana, sans-seri", "Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif",
                    "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"]
        function createCharacter()
        {
            const character = document.createElement("span");
            character.classList.add("character");

            character.textContent = characters[Math.floor(Math.random() * characters.length)];

            const side = Math.floor(Math.random() * 4);

            let startX;
            let startY;
            let endX;
            let endY;

            if (side === 0)
            {
                startX = Math.random() * window.innerWidth;

                startY = -50;

                endX = startX + (Math.random() * 300 - 150);

                endY = window.innerHeight + 50;
            }
            else if (side === 1)
            {
                startX = window.innerWidth + 50;

                startY = Math.random() * window.innerHeight;

                endX = -50;

                endY = startY + (Math.random() * 300 - 150);
            }
            else if (side === 2)
            {
                startX = Math.random() * window.innerWidth;

                startY = window.innerWidth + 50;

                endX = startX + (Math.random() * 300 - 150);

                endY = -50;
            }
            else
            {
                startX = -50;

                startY = Math.random () * window.innerHeight;

                endX = window.innerWidth + 50;

                endY = startY + (Math.random() * 300 - 150);
            }
            character.style.left = "0px";
            character.style.top = "0px";

            character.style.setProperty("--startX", startX + "px");

            character.style.setProperty("--startY", startY + "px");

            character.style.setProperty("--endX", endX + "px");

            character.style.setProperty("--endY", endY + "px");

            character.style.fontSize = 5 + Math.random() * 200 + "px";

            character.style.color = colors[Math.floor(Math.random() * colors.length)];

            character.style.fontFamily = fonts[Math.floor(Math.random() * fonts.length)];

            character.style.animationDuration = 6 + Math.random() * 8 + "s";

            character.style.setProperty("--rotation", Math.random() * 720 - 360 + "deg");

            floatingcharacters.appendChild(character);

            character.addEventListener("animationend", function()
            {
                character.remove();
            });
        }
        setInterval(createCharacter, 300);

        const loginform = document.getElementById("loginform");

        loginform.addEventListener("submit", function(event)
        {
            event.preventDefault();

            const username = loginform.elements["username"].value;
            const password = loginform.elements["password"].value;

            const savedAccount = JSON.parse(localStorage.getItem("account"));

            if (savedAccount == null)
            {
                alert("No account has been created yet!")
                return;
            }
            if (username === savedAccount.username && password === savedAccount.password)
            {
                alert("Login succesful!");
            }
            else
            {
                alert("Incorrect password or username!");
            }
        });
    </script>
</body>
</html>
