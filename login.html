<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Library - Login</title>
</head>
<style>
    h1
    {
        color: white;
    }
    body
    {
        background-color: black;
        color: rgba(229, 8, 236, 0.774);

        min-height: 100vh;
        margin: 0;

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Arial, sans-serif;

        overflow: hidden;
    }
    .login-container
    {
        position: relative;
        z-index: 1;

        width: 400px;
        padding: 40px;
        text-align: center;

        background-color: #0c0c0c;
        border: 1px solid rgba(79, 237, 79, 0.3);
        border-radius: 15px;
        box-shadow: 
            0 0 30px rgba(79, 237, 79, 0.08),
            0 0 80px rgba(79, 237, 79, 0.05);
    }
    form
    {
        display: flex;
        flex-direction: column;

        gap: 15px;

        margin-top: 20px;
    }
    input
    {
        width: 100px;
        padding: 14px;

        background-color: #080808;
        color: white;

        border: 1px solid rgba(79, 237, 79, 0.4);
        border-radius: 8px;

        font-size: 16px;
        outline: none;
        transition: 0.3s;
    }
    input::placeholder
    {
        color: #777777;
    }
    input:focus
    {
        border-color: #4fed4f;
        box-shadow: 0 0 8px rgba(79, 237, 79, 0.3);
    }
    button
    {
        padding: 14px;

        background-color: transparent;
        color: #4fed4f;

        border: 2px solid #4fed4f;
        border-radius: 8px;

        font-size: 18px;

        cursor: pointer;
        transition: 0.3s;
    }
    button:hover
    {
        background-color: #4fed4f;
        color: black;
        box-shadow:
            0 0 10px rgba(79, 237, 79, 0.5)
            0 0 25px rgba(79, 237, 79, 0.2)
    }
    .signup-text
    {
        margin-top: 10px;
        font-size: 14px;
        color: #888888;
    }
    .signup-text a
    {
        color: #e508ec;
        text-decoration: none;
        transition: 0.3s;
    }
    .signup-text a:hover
    {
        color: #4fed4f;
        text-shadow: 0 0 8px rgb(79, 237, 79, 0.5);
    }
    #floatingletters
    {
        position: fixed;

        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        pointer-events: none;

        overflow: hidden;
    }
    .letter
    {
        position: absolute;

        pointer-events: none;

        animation: drift linear forwards;
    }

    @keyframes drift
    {
        from
        {
            transform:
            translate(var(--startX), var(--startY))
            rotate(0deg);

            opacity: 0;
        }

        10%
        {
          opacity: 1;
        }

        to
        {
            transform:
                translate(var(--endX), var(--endY))
                rotate(var(--rotation));

            opacity: 0;
        }
    }
</style>
<body>
    <div id="floatingletters"></div>
    <div class="login-container">
        <h1>
            Welcome Back!
        </h1>
        <p>
            The library has been expecting you
        </p>
        <form>
            <input
                type="text"
                placeholder="Username"
                required
            >
            <input
                type="password"
                placeholder="Password"
                required
            >
            <button type="log-in">
                Enter
            </button>
            <p class="signup-text">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>
        </form>
    </div>
    <script>
        const floatingletters = document.getElementById("floatingletters");
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
        const colors = ["rgba(229, 8, 236, 0.774)", "rgba(79, 237, 79, 0.6)", "rgba(79, 218, 237, 0.6)", 
                        "rgba(226, 237, 79, 0.9)", "rgba(56, 15, 243, 0.9)", "rgba(205, 202, 216, 0.9)",
                        "rgba(152, 152, 152, 0.9)", "rgba(42, 42, 42, 0.9)"]

        function createLetter()
        {
            const letter = document.createElement("span");
            letter.classList.add("letter");

            letter.textContent = letters[Math.floor(Math.random() * letters.length)];

            const side = Math.floor(Math.random() * 4);

            let startX;
            let startY;
            let endX;
            let endY;

            if (side === 0)
            {
                startX = Math.random() * window.innerWidth;

                startY = -50;

                endX = startX + (Math.random() * 300 - 150);

                endY = window.innerHeight + 50;
            }
            else if (side === 1)
            {
                startX = window.innerWidth + 50;

                startY = Math.random() * window.innerHeight;

                endX = -50;

                endY = startY + (Math.random() * 300 - 150);
            }
            else if (side === 2)
            {
                startX = Math.random() * window.innerHeight;

                startY = window.innerWidth + 50;

                endX = startX + (Math.random() * 300 - 150);

                endY = -50;
            }
            else
            {
                startX = -50;

                startY = Math.random () * window.innerHeight;

                endX = window.innerWidth + 50;

                endY = startY + (Math.random() * 300 - 150);
            }
            letter.style.left = "0px";
            letter.style.top = "0px";

            letter.style.setProperty("--startX", startX + "px");

            letter.style.setProperty("--startY", startY + "px");

            letter.style.setProperty("--endX", endX + "px");

            letter.style.setProperty("--endY", endY + "px");

            letter.style.fontSize = 5 + Math.random() * 50 + "px";

            letter.style.color = colors[Math.floor(Math.random() * colors.length)];

            letter.style.animationDuration = 6 + Math.random() * 8 + "s";

            letter.style.setProperty("--rotation", Math.random() * 720 - 360 + "deg");

            floatingletters.appendChild(letter);

            letter.addEventListener("animationed", function()
            {
                letter.remove;
            });
        }
        setInterval(createLetter, 250);
    </script>
</body>
</html>
